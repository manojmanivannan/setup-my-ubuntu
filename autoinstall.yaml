#cloud-config
autoinstall:
  #
  # ==========================================================================
  # UBUNTU UNATTENDED (AUTO) INSTALL — USB PREPARATION INSTRUCTIONS
  # ==========================================================================
  # This file is the subiquity "user-data" file for Ubuntu autoinstall.
  # The installer does NOT read a file named "autoinstall.yaml" from the USB.
  # It looks for a volume labelled `CIDATA` containing exactly two files at
  # its ROOT:
  #
  #     user-data   <- THIS file, copied/renamed as "user-data"
  #     meta-data   <- a small text file (can be empty), e.g.:
  #                      instance-id: ubuntu-autoinstall-001
  #                      local-hostname: linux-laptop
  #
  # meta-data MUST exist even if empty, otherwise autoinstall is not detected.
  # This file must keep `#cloud-config` as its very first line.
  #
  # --------------------------------------------------------------------------
  # EXPECTED USB STRUCTURE
  # --------------------------------------------------------------------------
  #
  #     USB drive (e.g. /dev/sdb)                          <- ALL DATA WIPED
  #     ├── p1: Ubuntu ISO (written raw with dd)
  #     └── p2: FAT32, label = CIDATA          <-- config partition
  #           ├── user-data
  #           └── meta-data
  #
  # --------------------------------------------------------------------------
  # BUILD THE USB (ARCH LINUX)
  # --------------------------------------------------------------------------
  #
  # 1. Install tools:
  #        sudo pacman -S dosfstools
  #
  # 2. Identify the USB drive (here assumed /dev/sdb) and confirm it is the
  #    right one — everything on it is destroyed:
  #        lsblk
  #
  # 3. Write the Ubuntu ISO to the whole stick (this creates partition 1):
  #        sudo dd if=ubuntu-<version>-desktop-amd64.iso of=/dev/sdb \
  #                bs=4M status=progress oflag=sync,direct
  #
  # 4. Create partition 2 in the free space after the ISO and label it CIDATA:
  #        sudo parted /dev/sdb --script print free        # note the free start
  #        sudo parted /dev/sdb --script mkpart CIDATA fat32 <start> 100%
  #        sudo mkfs.vfat -F 32 -n CIDATA /dev/sdb2
  #    The label MUST be exactly `CIDATA` — this is how the installer finds it.
  #
  # 5. Copy the two config files to the ROOT of partition 2 (not inside a
  #    subfolder):
  #        sudo mount /dev/sdb2 /mnt
  #        sudo cp autoinstall.yaml /mnt/user-data
  #        sudo cp meta-data       /mnt/meta-data
  #        sudo umount /mnt && sync
  #
  # --------------------------------------------------------------------------
  # BOOT BEHAVIOUR
  # --------------------------------------------------------------------------
  #   * Ubuntu DESKTOP ISO (22.04+): the installer auto-detects the CIDATA
  #     volume and offers/starts the automated install — no extra input.
  #   * Ubuntu SERVER ISO: boot to GRUB, press `e` on the first entry and add
  #     `autoinstall` to the end of the `linux` line, then Ctrl+X to boot.
  #   * The target disk is wiped automatically — double-check the config first.
  #   * On failure, logs are collected per the `error-commands` block below
  #     (/var/log/installer + journal).
  #
  # NOTE: during early-commands, subiquity exposes this file at
  # /autoinstall.yaml in the live environment, so the disk-sizing script
  # below still works unchanged.
  # ==========================================================================
  #

  version: 1
  keyboard:
    layout: "us"
    variant: ""
  locale: "en_US.UTF-8"
  timezone: "Europe/London"

  source:
    id: ubuntu-desktop-minimal

  # Dynamically parition the disk
  # 50 GB root partition
  # Swap size same as RAM
  # Remainder set to home
  early-commands:
    - |
      python3 - <<'EOF'
      import subprocess, math, yaml, os

      disks = subprocess.check_output(
          ["lsblk", "-b", "-dn", "-o", "SIZE"],
          text=True
      ).strip().splitlines()

      disk_bytes = max(int(d) for d in disks)
      disk_gb = math.floor(disk_bytes / (1024**3))

      root_gb = max(50, math.ceil(disk_gb * 0.10))
      mem_gb = math.ceil(
          os.sysconf("SC_PAGE_SIZE") *
          os.sysconf("SC_PHYS_PAGES") /
          (1024**3)
      )
      swap_size_gb = mem_gb
      remainder_gb = disk_gb - root_gb - swap_size_gb

      storage = {
          "config": [
              {"type": "disk", "id": "disk-primary",
               "match": {"size": "largest"},
               "ptable": "gpt", "wipe": "superblock-recursive",
               "grub_device": True},

              {"type": "partition", "id": "part-bios",
               "device": "disk-primary", "size": "1M",
               "flag": "bios_grub"},

              {"type": "partition", "id": "part-efi",
               "device": "disk-primary", "size": "500M",
               "flag": "esp"},

              {"type": "format", "id": "fmt-efi",
               "volume": "part-efi", "fstype": "fat32"},

              {"type": "mount", "id": "mnt-efi",
               "device": "fmt-efi", "path": "/boot/efi"},

              {"type": "partition", "id": "part-root",
               "device": "disk-primary", "size": f"{root_gb}G"},

              {"type": "format", "id": "fmt-root",
               "volume": "part-root", "fstype": "ext4"},

              {"type": "mount", "id": "mnt-root",
               "device": "fmt-root", "path": "/"},

              {"type": "partition", "id": "part-swap",
               "device": "disk-primary",
               "size": f"{swap_size_gb}G", "flag": "swap"},

              {"type": "format", "id": "fmt-swap",
               "volume": "part-swap", "fstype": "swap"},

              {"type": "mount", "id": "mnt-swap",
                "device": "fmt-swap", "path": "none"},

              {"type": "partition", "id": "part-home",
               "device": "disk-primary", "size": -1},

              {"type": "format", "id": "fmt-home",
               "volume": "part-home", "fstype": "ext4"},

              {"type": "mount", "id": "mnt-home",
               "device": "fmt-home", "path": "/home"},
          ]
      }

      with open("/autoinstall.yaml") as f:
          auto_data = yaml.safe_load(f)

      auto_data["storage"] = storage

      with open("/autoinstall.yaml", "w") as f:
          yaml.safe_dump(auto_data, f, sort_keys=False)

      print(
          f"Disk: {disk_gb}G | Root: {root_gb}G | "
          f"Home: {remainder_gb}G | Swap: {swap_size_gb}G"
      )
      EOF

  package_update: true
  package_upgrade: false

  # User profile
  user-data:
    hostname: linux-laptop
    users:
      - name: username
        gecos: "User Full Name"
        # generate password using mkpasswd -m sha-512 "your password"
        passwd: "$6$y4KC8t4Xk/kr6....."
        shell: /bin/bash
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        primary_group: username
        groups: [adm, cdrom, dip, lxd, users, sudo, docker]
        lock_passwd: false
        ssh_authorized_keys: ["ssh-rsa AAAAB3NzaC1........... name@email.com"]

  # Storage / Partitioning
  storage:
    #
    # Disable python command in early-command & below config section and enable layout if auto partitioning with disk encryption
    #
    # layout:
    #     name: lvm
    #     sizing-policy: all
    #     password: "Encryption Passphrase"
    #     match:
    #       size: largest
    #
    config:
      - type: disk
        id: disk-primary
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
        grub_device: true

      # BIOS Boot parition
      - type: partition
        id: part-bios
        device: disk-primary
        size: 1M
        flag: bios_grub

      # EFI (500M)
      - type: partition
        id: part-efi
        device: disk-primary
        size: 500M
        flag: esp
      - type: format
        id: fmt-efi
        volume: part-efi
        fstype: fat32
      - type: mount
        id: mnt-efi
        device: fmt-efi
        path: /boot/efi

      # Swap (Dynamic placeholder)
      - type: partition
        id: part-swap
        device: disk-primary
        size: 4G
        flag: swap
      - type: format
        id: fmt-swap
        volume: part-swap
        fstype: swap
      - type: mount
        id: mnt-swap
        device: fmt-swap
        path: none

      # Root (100G)
      - type: partition
        id: part-root
        device: disk-primary
        size: 80G
      - type: format
        id: fmt-root
        volume: part-root
        fstype: ext4
      - type: mount
        id: mnt-root
        device: fmt-root
        path: /

      # Home (Remaining)
      - type: partition
        id: part-home
        device: disk-primary
        size: -1
      - type: format
        id: fmt-home
        volume: part-home
        fstype: ext4
      - type: mount
        id: mnt-home
        device: fmt-home
        path: /home

  # Installer Environment SSH (Optional)
  ssh:
    install-server: true
    allow-pw: true

  # ubuntu-pro:
  #   token: you_ubuntu_pro_token

  # Network Configuration
  network:
    version: 2
    renderer: NetworkManager

    wifis:
      wlans:
        match:
          name: wl*
        dhcp4: false
        addresses: [192.168.1.141/24]
        nameservers:
          addresses: [192.168.1.1]
        routes:
          - to: default
            via: 192.168.1.1
            metric: 100
        access-points:
          "toob-CB70F8":
            password: "your-wifi-password"

    ethernets:
      eths:
        match:
          name: et*
        dhcp4: false
        addresses: [192.168.1.142/24]
        nameservers:
          addresses: [192.168.1.1]
        routes:
          - to: default
            via: 192.168.1.1
            metric: 200

  # Desktop Specifics
  codecs:
    install: true
  drivers:
    install: true

  # Apt Mirrors
  apt:
    preserve_sources_list: false
    mirror-selection:
      primary:
        - country-mirror
        - arches: [default]
          uri: http://archive.ubuntu.com/ubuntu
    geoip: true

    sources:
      # We will add APT repo without signing key for docker installation since adding signing key here is not support.
      # Later in the installation, in late-commands section, we will add the repo properly
      docker:
        source: deb [arch=amd64] https://download.docker.com/linux/ubuntu $RELEASE stable
        key: |-
          -----BEGIN PGP PUBLIC KEY BLOCK-----

          mQINBFit2ioBEADhWpZ8/wvZ6hUTiXOwQHXMAlaFHcPH9hAtr4F1y2+OYdbtMuth
          lqqwp028AqyY+PRfVMtSYMbjuQuu5byyKR01BbqYhuS3jtqQmljZ/bJvXqnmiVXh
          38UuLa+z077PxyxQhu5BbqntTPQMfiyqEiU+BKbq2WmANUKQf+1AmZY/IruOXbnq
          L4C1+gJ8vfmXQt99npCaxEjaNRVYfOS8QcixNzHUYnb6emjlANyEVlZzeqo7XKl7
          .....
          M8ssD1jFheOJf3hODnkKU+HKjvMROl1DK7zdmLdNzA1cvtZH/nCC9KPj1z8QC47S
          xx+dTZSx4ONAhwbS/LN3PoKtn8LPjY9NP9uDWI+TWYquS2U+KHDrBDlsgozDbs/O
          jCxcpDzNmXpWQHEtHU7649OXHP7UeNST1mCUCH5qdank0V1iejF6/CfTFU4MfcrG
          YT90qFF93M3v01BbxP+EIY2/9tiIPbrd
