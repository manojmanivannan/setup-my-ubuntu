          -----END PGP PUBLIC KEY BLOCK-----

  # Install VS Code
  snaps:
    - name: code
      classic: true
      channel: stable
    - name: vlc
      channel: stable
    - name: sublime-text
      channel: stable
      classic: true
    - name: sublime-merge
      channel: stable
      classic: true

  # Package Installation
  packages:
    - git
    - curl
    - zsh
    - python3-pip
    - python3-venv
    - apt-transport-https
    - ca-certificates
    - gnupg-agent
    - software-properties-common
    - docker.io
    - docker-compose-plugin

  groups:
    - docker: [username]

  # TODO: investigate curtin in-target -- $SHELL_CMD
  late-commands:
    # Setup APT source for docker
    - /target/usr/bin/curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /target/usr/share/keyrings/docker-archive-keyring.gpg
    - rm -f /target/etc/apt/sources.list.d/docker.sources
    - |
      CODENAME="$(. /etc/os-release && echo ${UBUNTU_CODENAME:-$VERSION_CODENAME})"

      cat > /target/etc/apt/sources.list.d/docker.sources <<EOF
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: ${CODENAME}
      Components: stable
      Signed-By: /usr/share/keyrings/docker-archive-keyring.gpg
      EOF

  updates: all

  shutdown: poweroff

  error-commands: # A list of commands to run after the installation has failed.
    - tar -czf /installer-logs.tar.gz /var/log/installer # For example, collect installer logs in /var/log/installer
    - journalctl -b > /installer-journal.log # Collect the live system journal tool
